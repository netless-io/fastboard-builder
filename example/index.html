<!DOCTYPE html>
<html>
  <head>
    <title>Fastboard Example</title>
  </head>
  <body>
    <div id="fastboard" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
    <script src="../dist/index.global.js"></script>
    <script>
        const SOUP = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        const SOUP_LEN = 62; // SOUP.length
        const ID_LEN = 20;
        const reusedIdCarrier = /* @__PURE__ */ Array(ID_LEN);

        function genUID() {
            for (let i = 0; i < ID_LEN; i++) {
                reusedIdCarrier[i] = SOUP.charAt(Math.random() * SOUP_LEN);
            }
            return reusedIdCarrier.join("");
        }

        // 移除自带的Monaco app和GeoGebra app
        // NetlessFastboard.apps.delete(app => app.kind === "Monaco");
        // NetlessFastboard.apps.delete(app => app.kind === "GeoGebra");

        NetlessFastboard.register({
            kind: "Slide",
            src: 'https://cdn.jsdelivr.net/npm/@netless/app-slide@0.2.78/dist/main.iife.js',
            name: "NetlessAppSlide",
            appOptions: {
                navigatorDelegate: {
                    openUrl(url) {
                        console.log("open url", url);
                        // get customLink url
                        // todo custom link url
                    }
                }
            }
        });

        // 添加一个slide app 到 apps中
        NetlessFastboard.apps.push({
            icon: "https://api.iconify.design/mdi:file-powerpoint-box.svg?color=%237f7f7f",
            kind: "Slide",
            label: "Slide",
            onClick: (app) => {
                const taskId = '46e8ff5db5714fec818f5594a6c55083';
                const url = 'https://white-cover.oss-cn-hangzhou.aliyuncs.com/flat/dynamicConvert';
                app.manager.addApp({
                    kind: "Slide",
                    options: {
                        scenePath: `/pptx/${taskId}`,
                        title: "a.pptx",
                    },
                    attributes: {
                        taskId,
                        url,
                        customLinks: [
                            {
                                "pageIndex": 1,
                                "shapeId": "slide-9",
                                "link": "www.baidu.com"
                            },
                            {
                                "pageIndex": 1,
                                "shapeId": "slide-2",
                                "link": ""
                            },
                            {
                                "pageIndex": 1,
                                "shapeId": "slide-11",
                                "link": ""
                            },
                            {
                                "pageIndex": 2,
                                "shapeId": "slide-3079",
                                "link": ""
                            },
                            {
                                "pageIndex": 4,
                                "shapeId": "slide-3",
                                "link": ""
                            }
                        ]
                    }
                })
            },
        });

        NetlessFastboard.createFastboard({
            sdkConfig: {
                appIdentifier: "123456789/123456789",
                region: "cn-hz",
            },
            joinRoom: {
                uid: genUID(),
                uuid: "cbc67f00169f11f0826bfd782d7d3846",
                roomToken: "NETLESSROOM_YWs9VWtNUk92M1JIN2I2Z284dCZleHBpcmVBdD0xNzY2NTYxMjg0MTQ2Jm5vbmNlPWViM2YyMTIwLWRmZDAtMTFmMC05NmE5LWFiMzg4NjE4OThhZiZyb2xlPTEmc2lnPTkwMmYwNDA4OWZkMjdiYTFlMzg0OTExNWI0OWRlYzhiN2RkYzYyMDVjNDU1NjJjZTBmMjkzM2RiNDBmZGZhNzImdXVpZD1jYmM2N2YwMDE2OWYxMWYwODI2YmZkNzgyZDdkMzg0Ng",
            },
            managerConfig: {
                cursor: true,
            },
        }).then((fastboard)=>{
            const container = document.getElementById('fastboard');
            const ui = NetlessFastboard.createUI(fastboard, container);
            ui.mount(container, {
                config: {
                    toolbar: {
                        items: ["clicker", "selector", "pencil", "text", "shapes", "eraser", "clear", "laserPointer"],
                        collapsed: true,
                    },
                },
            });
            window.fastboard = fastboard;
            window.ui = ui;
        });
    </script>
  </body>
</html>
